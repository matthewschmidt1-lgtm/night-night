<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It’s OK to let go</title>
<style>
  :root{
    --stage:#080e1c;
    --ink:#f5f5f7;
    --ink-soft:rgba(245,245,247,.62);
    --ink-line:rgba(245,245,247,.26);
    --sf:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  }
  html,body{height:100%;margin:0;background:var(--stage);overflow:hidden}
  body{font-family:var(--sf);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;-webkit-tap-highlight-color:transparent}

  /* everything the owl says: one voice, two moments */
  .say{
    position:fixed;left:0;right:0;bottom:50%;box-sizing:border-box;padding:0 24px;
    text-align:center;color:var(--ink);font-family:var(--sf);pointer-events:none;
    text-shadow:0 0 18px rgba(6,10,22,.85), 0 1px 3px rgba(0,0,0,.45);
  }
  .say.open{font-size:clamp(26px,7vw,46px);font-weight:300;line-height:1.2;white-space:nowrap}
  .say.open .wd.em{font-weight:500}
  .say.advice{
    left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:min(92vw,480px);
    padding:16px 22px;
    font-size:clamp(17px,4.5vw,23px);font-weight:300;line-height:1.4;letter-spacing:.01em;
  }
  /* a soft, slightly see-through shade behind the advice so it reads in front of the branches */
  .say.advice::before{
    content:"";position:absolute;inset:0;z-index:-1;border-radius:20px;
    background:rgba(5,9,20,.6);
    box-shadow:0 0 26px 12px rgba(5,9,20,.34);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:var(--pa,0);
  }
  .wd{display:inline-block;margin:0 .14em;opacity:0;will-change:transform,opacity,filter}

  #nn{
    position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;
    color:rgba(245,245,247,.92);font-family:var(--sf);font-weight:300;
    font-size:clamp(56px,17vw,120px);letter-spacing:.05em;text-indent:.05em;line-height:1.08;
    text-shadow:0 0 30px rgba(140,130,255,.28);
  }
  #nn .nl{display:block;opacity:0}
  #nn .bl{display:inline-block;width:0;height:0}
  #hint{
    position:fixed;left:0;right:0;text-align:center;pointer-events:none;
    bottom:120px;
    font:300 15px/1.2 var(--sf);letter-spacing:.05em;color:var(--ink);opacity:0;
    text-shadow:0 0 12px rgba(6,10,22,.9), 0 1px 3px rgba(0,0,0,.6);
  }
  #replay{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    font:500 15px/1 var(--sf);color:rgba(245,245,247,.8);
    background:rgba(8,12,24,.6);border:1px solid var(--ink-line);border-radius:999px;
    padding:10px 18px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  #replay.on{opacity:1;pointer-events:auto;transition:opacity 1.4s ease 3s}
  #replay:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An aspen tree sprouts, grows, turns gold and lets its leaves fall under a slowly turning sky of stars. A wise old owl and a smaller white owl settle in the branches. Tap the owl for night advice from the stars. Left alone, the two owls hop up the tree, share a kiss while hearts drift into the sky, and everything fades to a night of spinning stars, a galaxy of new stars, two blinking owl eyes and a heart made of stars, then the whole night rushes toward you, and the words Night Night appear, each with two owl eyes blinking inside the g, before it all begins again."></canvas>
<div id="hint">Tap the owl for night advice</div>
<div id="nn" aria-hidden="true"><div class="nl">Ni<span class="gg">g<i class="bl"></i></span>ht</div><div class="nl">Ni<span class="gg">g<i class="bl"></i></span>ht</div></div>
<button id="replay" type="button">Replay</button>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const btn = document.getElementById('replay');
  const nn = document.getElementById('nn');
  const nnLines = [...nn.querySelectorAll('.nl')], gEls = [...nn.querySelectorAll('.gg')], blEls = [...nn.querySelectorAll('.bl')];
  let nnEyes = [];
  const speeches = [], advs = [];
  const beak = { x: 0, y: 0 };
  const periodPos = { x: 0, y: 0, r: 6 };
  const pokes = { b: -99, w: -99 };
  let fsB = 40, fin = null, lastAct = 0;

  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgbs = (c, lit = 0) =>
    `rgb(${Math.min(255, (c[0] + (255 - c[0]) * lit)) | 0},${Math.min(255, (c[1] + (255 - c[1]) * lit)) | 0},${Math.min(255, (c[2] + (255 - c[2]) * lit)) | 0})`;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- Timeline (game seconds; SPEED slows playback) ----------
  const T = { turn0: 12, owl: 20.5, owl2: 24, speak: 28.5, leafA: 34, leafF: 35.8, leafD: 5.5, rest: 41, ready: 42, end: 45 };
  const SPEED = 0.85;
  const WSTART = [0, 0.8, 1.7, 2.4, 3.1];      // opening line: when each word leaves the beak
  const LDUR = 1.8;                            // how long a word takes to drift into place
  const SKY_W = 0.06;                          // the sky turns counterclockwise, constantly (radians per game-second)
  const SKY_B = 0.10;                          // extra spin during the finale
  const IDLE = 12;                             // quiet seconds before the owls go off to meet

  const ADVICE = [
    "The light you’re seeing left its star long ago. Some things keep reaching us after they’ve gone.",
    "Stars burn without gripping. They never ask the dark to be different.",
    "The iron in your blood was made inside a dying star. Endings have always become something.",
    "The North Star holds still so the whole sky can turn. Be gentle with whatever steadies you.",
    "Stars need the dark to be seen. Be tender with your hardest nights. They’re doing quiet work.",
    "Nobody is behind. Even the slowest star turns with the rest of the sky.",
    "The dark between the stars isn’t emptiness. It’s the room they need to shine.",
    "Some starlight takes a thousand years to arrive. You’re allowed to take your time.",
    "The stars go quiet every morning. They haven’t gone anywhere. They’re resting in the light.",
    "Look up for a moment. Whatever you’re carrying will still be there, but you’ll hold it a little lighter.",
    "A constellation is only distance and patience, connected. Your scattered days make a shape too.",
    "You don’t have to shine every night. Even the moon takes it one phase at a time.",
    "Every star up there is older than your worries. Let them be a little smaller tonight.",
    "Rest is part of the pattern. The sky keeps turning, and the night makes room for you."
  ];
  let bag = [];
  function nextAdvice() {
    if (!bag.length) bag = shuffle(ADVICE.map((_, i) => i));
    return ADVICE[bag.pop()];
  }

  function mulberry(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function sample(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, a] = keys[i - 1], [t1, b] = keys[i];
        const k = smooth(t0, t1, t);
        return a.map((v, j) => v + (b[j] - v) * k);
      }
    }
    return keys[keys.length - 1][1];
  }

  // A night sky the whole way through; only the horizon warms with the seasons.
  const BG_TOP = [[0,[8,14,28]],[11,[10,20,36]],[16,[26,22,38]],[22,[24,20,36]],[31,[14,18,34]],[42,[9,12,26]]];
  const BG_BOT = [[0,[22,44,50]],[11,[34,66,58]],[16,[104,60,36]],[22,[80,52,46]],[31,[40,46,68]],[42,[26,32,52]]];
  const GLOW   = [[0,[120,210,140,.10]],[11,[140,220,130,.20]],[15,[255,200,90,.30]],[21,[255,150,70,.22]],[31,[170,180,210,.10]],[42,[150,160,200,.07]]];

  // ---------- Tree structure (unit space: trunk height = 1, y up) ----------
  const rnd = mulberry(20);
  const segs = [], leaves = [], eyes = [], prims = [];
  const trunkX = u => 0.011 * Math.sin(u * 2.6 + 0.7) - 0.0045;
  const bez = (s, t) => {
    const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    return [a * s.p0[0] + b * s.p1[0] + c * s.p2[0], a * s.p0[1] + b * s.p1[1] + c * s.p2[1]];
  };
  const bezTan = (s, t) => {
    const x = 2 * (1 - t) * (s.p1[0] - s.p0[0]) + 2 * t * (s.p2[0] - s.p1[0]);
    const y = 2 * (1 - t) * (s.p1[1] - s.p0[1]) + 2 * t * (s.p2[1] - s.p1[1]);
    const l = Math.hypot(x, y) || 1; return [x / l, y / l];
  };

  function makeLeaf(seg, s, ux, uy, ang, appear) {
    const turn0 = T.turn0 + (1 - uy) * 1.6 + rnd() * 2.4;
    const turnD = 4.5 + rnd() * 1.5;
    const fall0 = turn0 + turnD + 0.2 + rnd() * 3.2;
    const fallD = 3.4 + rnd() * 2.4;
    return {
      seg, s, ux, uy, ang, appear,
      r: 0.75 + rnd() * 0.5, ph: rnd() * TAU, fq: 2.4 + rnd() * 2.4, v: 0.9 + rnd() * 0.2,
      turn0, turnD, fall0, fallD, landT: fall0 + fallD,
      dx: ((rnd() + rnd() + rnd()) / 3 - 0.5) * 0.95,
      ly: rnd(), sw: 2 + rnd() * 2.5, spin: (rnd() - 0.5) * 5, rest: (rnd() - 0.5) * 5
    };
  }

  for (let i = 0; i < 30; i++) eyes.push({ u: 0.03 + rnd() * 0.88, off: (rnd() - 0.5) * 0.5, sz: 0.5 + rnd() * 0.9 });

  // three stout branches are set aside: the wise owl's, the white owl's, and the one where they meet
  let owlSeg = null, whiteSeg = null, meetSeg = null;
  const N = 22;
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1);
    const u = 0.30 + 0.68 * Math.pow(f, 0.92) + (rnd() - 0.5) * 0.015;
    let side = (i % 2 ? 1 : -1) * (rnd() < 0.12 ? -1 : 1);
    const crown = clamp((u - 0.22) / 0.8);
    let L = 0.03 + 0.19 * Math.pow(Math.sin(Math.PI * crown), 0.8) * (0.85 + rnd() * 0.3);
    let ang = lerp(1.05, 0.42, f) + (rnd() - 0.5) * 0.25;
    const kind = i === 1 ? 'brown' : i === 2 ? 'white' : i === 16 ? 'meet' : null;
    if (kind === 'brown') { side = 1; L = 0.26; ang = 1.42; }
    if (kind === 'white') { side = -1; L = 0.2; ang = 1.38; }
    if (kind === 'meet') { side = -1; L = 0.22; ang = 1.36; }
    const x0 = trunkX(u), y0 = u;
    const t0 = u * 0.85;
    const seg = {
      p0: [x0, y0],
      p1: [x0 + side * Math.sin(ang) * L * 0.8, y0 + Math.cos(ang) * L * 0.12],
      p2: [x0 + side * Math.sin(ang) * L, y0 + Math.cos(ang) * L * 0.92],
      t0, span: Math.min(0.22 + rnd() * 0.05, 1 - t0 - 0.001),
      w0: kind === 'brown' ? 0.0105 : kind === 'white' ? 0.0095 : kind === 'meet' ? 0.0082 : 0.0075 * (1 - 0.35 * f),
      w1: kind ? 0.0043 : 0.0026, twig: false
    };
    segs.push(seg);
    if (kind === 'brown') owlSeg = seg; else if (kind === 'white') whiteSeg = seg; else if (kind === 'meet') meetSeg = seg;
    else prims.push({ seg, u });
    eyes.push({ u, off: side * 0.22, sz: 1.25 });

    for (const s of [0.42, 0.62, 0.8, 1, 1]) {
      const pt = bez(seg, s);
      leaves.push(makeLeaf(seg, s, pt[0], pt[1], (rnd() - 0.5) * 2.2, 0));
    }

    const sList = kind ? [0.18, 0.3, 0.95] : [0.38, 0.6, 0.8];
    for (let k = 0; k < 3; k++) {
      const sa = Math.min(1, sList[k] + (rnd() - 0.5) * 0.08);
      const pt = bez(seg, sa), tg = bezTan(seg, sa);
      const rot = (0.55 + rnd() * 0.5) * (k % 2 ? 1 : -1) * (side > 0 ? 1 : -1);
      let dx = tg[0] * Math.cos(rot) - tg[1] * Math.sin(rot);
      let dy = tg[0] * Math.sin(rot) + tg[1] * Math.cos(rot) + 0.3;
      const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
      const len = L * (0.42 - 0.14 * sa + rnd() * 0.1);
      const tt0 = seg.t0 + seg.span * sa;
      const tw = {
        p0: pt,
        p1: [pt[0] + dx * len * 0.55, pt[1] + dy * len * 0.55 + len * 0.1],
        p2: [pt[0] + dx * len, pt[1] + dy * len],
        t0: tt0, span: Math.max(0.02, Math.min(0.16, 1 - tt0 - 0.001)),
        w0: 0.0032, w1: 0.0012, twig: true
      };
      segs.push(tw);
      for (const s of [0.5, 0.8, 1, 1]) {
        const p = bez(tw, s);
        leaves.push(makeLeaf(tw, s, p[0], p[1], (rnd() - 0.5) * 2.2, 0));
      }
    }
  }
  const topAngles = [Math.PI - 1.1, Math.PI + 1.1, Math.PI - 0.5, Math.PI + 0.5, Math.PI, Math.PI + 0.25];
  topAngles.forEach((a, i) => leaves.push(makeLeaf(null, 1, trunkX(1), 1, a, 1.5 + i * 0.9)));
  const byLy = leaves.slice().sort((a, b) => a.ly - b.ly);

  const motes = Array.from({ length: 28 }, () => ({ x: rnd(), y: rnd(), s: 0.02 + rnd() * 0.04, r: 0.6 + rnd() * 1.6, ph: rnd() * TAU }));
  // stars sit on a big disc that turns around a pole; a few are brighter
  const stars = Array.from({ length: 900 }, (_, i) => {
    const big = i < 50;
    return {
      a: rnd() * TAU, rr: Math.sqrt(rnd()),
      sz: big ? 1.6 + rnd() * 0.9 : 0.5 + Math.pow(rnd(), 4) * 1.4,
      br: big ? 0.9 + rnd() * 0.1 : 0.4 + rnd() * 0.6,
      tr: 0.008 + rnd() * 0.022, ph: rnd() * TAU, big
    };
  });

  // an outer galaxy layer, blue-violet and faint. The first 24 stars are "seeds": the ones the hearts become.
  const GAL_TINT = [[150,150,255],[175,140,255],[135,175,255],[195,165,255]];
  const gal = Array.from({ length: 340 }, (_, i) => {
    const seed = i < 24, arm = i % 2, rr = seed ? 0.18 + rnd() * 0.8 : Math.pow(rnd(), 0.65);
    return {
      a: arm * Math.PI + 3.2 * Math.log(1 + rr * 3.5) + (rnd() - 0.5) * 0.55 * (1 - rr * 0.4), rr,
      sz: seed ? 1.5 + rnd() * 0.7 : 0.4 + rnd() * 0.8, br: seed ? 0.95 : 0.3 + rnd() * 0.45,
      ph: rnd() * TAU, tint: GAL_TINT[i % 4], seed
    };
  });
  // a heart drawn by stars: an outline plus a scatter inside, each with its own moment to appear
  const HEART = [], HN = 46;
  for (let k = 0; k < HN; k++) {
    const th = TAU * k / HN;
    HEART.push({ x: 16 * Math.pow(Math.sin(th), 3), y: 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th),
      key: Math.abs(th - Math.PI) / Math.PI, sz: 1.7 + rnd() * 0.9, ph: rnd() * TAU, ring: true });
  }
  for (let k = 0; k < 22; k++) {
    const th = TAU * k / 22 + 0.13, sc2 = 0.42 + rnd() * 0.3;
    HEART.push({ x: sc2 * 16 * Math.pow(Math.sin(th), 3), y: sc2 * (13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th)),
      key: 0.25 + Math.abs(th - Math.PI) / Math.PI * 0.75, sz: 1 + rnd() * 0.8, ph: rnd() * TAU, ring: false });
  }

  // ---------- Leaf shape ----------
  const LEAF = new Path2D();
  LEAF.moveTo(0, 0);
  LEAF.bezierCurveTo(1.3, 0.2, 1.2, 1.7, 0, 2.1);
  LEAF.bezierCurveTo(-1.2, 1.7, -1.3, 0.2, 0, 0);
  LEAF.closePath();
  const VEIN = new Path2D();
  VEIN.moveTo(0, 0.1); VEIN.lineTo(0, 1.85);

  let W = 0, H = 0, dpr = 1, S = 500, gy = 0, cx = 0, band = 0;

  // ---------- Sky: constant counterclockwise turning, shooting star, advice star ----------
  function spinI(x, d = 5) {                           // an eased spin: ramps in over d seconds, then keeps going
    if (x <= 0) return 0;
    const xn = clamp(x / d);
    return xn < 1 ? d * (xn * xn * xn - xn * xn * xn * xn / 2) : d * 0.5 + (x - d);
  }
  // counterclockwise the whole time; faster after the kiss, calmer again once the field zooms out
  const skyTh = t => -SKY_W * t - (fin ? SKY_B * (spinI(t - fin.tK) - 0.8 * spinI(t - fin.z0, fin.z1 - fin.z0)) : 0);
  // at the end of the heart the whole field rushes toward the viewer
  const zoomK = t => fin ? Math.exp(Math.log(8) * Math.pow(clamp((t - fin.tF0) / (fin.tF1 - fin.tF0)), 2.3)) : 1;
  function skyGeom(t = 0) {
    const zp = fin ? smooth(fin.z0, fin.z1, t) : 0;   // near the very end the whole field pulls back and shrinks
    const K = zoomK(t);
    const p0x = W * 0.68, p0y = H * 0.13;
    return {
      pxs: lerp(p0x, W * 0.5, zp), pys: lerp(p0y, H * 0.42, zp), p0x, p0y, zp, K, scale: lerp(1, 0.3, zp) * K, th: skyTh(t),
      Rmax: Math.hypot(Math.max(p0x, W - p0x), Math.max(H - p0y, p0y))
    };
  }
  function starPos(s, t, g) {
    const th = s.a + g.th, r = s.rr * g.Rmax * g.scale;
    return { x: g.pxs + r * Math.cos(th), y: g.pys + r * Math.sin(th), th, r };
  }
  function drawStars(t, cullY, gain) {
    const g = skyGeom(t);
    const sa = smooth(0.2, 2.5, t) * (0.85 + 0.15 * smooth(14, 30, t)) * gain;
    const boost = fin ? smooth(fin.tK, fin.tK + 5, t) * (1 - 0.6 * g.zp) : 0;
    const tk = (0.6 + 1.4 * Math.min(1, sa)) * (1 + 1.5 * boost) * (0.4 + 0.6 * g.scale);
    const wk = clamp((g.K - 1) / 2), szf = lerp(1, 0.55, g.zp) * Math.pow(g.K, 0.45);
    ctx.lineCap = 'round';
    for (const s of stars) {
      const p = starPos(s, t, g);
      if (p.y > cullY || p.y < -4 || p.x < -4 || p.x > W + 4) continue;
      const al = Math.min(1, sa * s.br * (0.75 + 0.25 * Math.sin(t * 1.6 + s.ph)) * (1 - smooth(0.82, 1, s.rr)));
      ctx.strokeStyle = `rgba(232,238,255,${al * 0.45 * (1 - wk)})`; ctx.lineWidth = s.sz * 0.7 * szf;
      if (wk < 0.95) { ctx.beginPath(); ctx.arc(g.pxs, g.pys, p.r, p.th, p.th + s.tr * tk); ctx.stroke(); }
      if (s.big) {
        const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7 * szf);
        rg.addColorStop(0, `rgba(240,245,255,${al * 0.35})`); rg.addColorStop(1, 'rgba(240,245,255,0)');
        ctx.fillStyle = rg; ctx.fillRect(p.x - 7, p.y - 7, 14, 14);
      }
      ctx.fillStyle = `rgba(246,248,255,${al})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, s.sz * 0.7 * szf, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,250,235,${Math.min(1, sa) * 0.9})`;
    ctx.beginPath(); ctx.arc(g.pxs, g.pys, 2 * szf, 0, TAU); ctx.fill();
  }
  function pickStar(t) {
    const g = skyGeom(t), c = [];
    for (const s of stars) {
      if (s.sz < 0.9) continue;
      const p = starPos(s, t, g);
      if (p.y > H * 0.06 && p.y < gy * 0.58 && p.x > W * 0.12 && p.x < W * 0.88) c.push(s);
    }
    return c.length ? c[Math.floor(Math.random() * c.length)] : stars[0];
  }
  const starNow = (ad, t) => starPos(ad.star, t, skyGeom(t));
  function shootHead(ad, t) {
    const tp = starNow(ad, t), pp = clamp((t - ad.c0) / 1.5), e = 1 - Math.pow(1 - pp, 1.8);
    return { x: ad.s0.x + (tp.x - ad.s0.x) * e, y: ad.s0.y + (tp.y - ad.s0.y) * e, tp, pp };
  }
  function drawShoot(ad, t) {
    const p = (t - ad.c0) / 1.5;
    if (p <= 0 || p > 1.3) return;
    const h = shootHead(ad, t);
    const dx = h.tp.x - ad.s0.x, dy = h.tp.y - ad.s0.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;

    let c;
    if (tp <= 0) c = mixc(G0, GF, fresh);
    else if (tp < 0.34) c = mixc(G0, YL, tp / 0.34);
    else if (tp < 0.68) c = mixc(YL, OR, (tp - 0.34) / 0.34);
    else c = mixc(OR, TAN, (tp - 0.68) / 0.32);
    return [c[0] * v, c[1] * v, c[2] * v];
  }

  function gazeFor(hx, hy, t, lc) {                    // shooting star / chosen star first, else the last leaf
    const gz = { x: 0, y: 0, w: 0 };
    const ad = advs[advs.length - 1];
    if (ad) {
      const w = smooth(ad.c0, ad.c0 + 0.5, t) * (1 - smooth(ad.sp.t0, ad.sp.t0 + 0.9, t));
      if (w > 0.001) {
        const tg = t < ad.c0 + 1.5 ? shootHead(ad, t) : starNow(ad, t);
        gz.w = w; gz.x = clamp((tg.x - hx) / (S * 0.22), -1, 1); gz.y = clamp((tg.y - hy) / (S * 0.3), -1, 1);
        return gz;
      }
    }
    if (lc) {
      const c = lc.c, lf = lc.s;
      gz.w = smooth(c.a, c.a + 1.2, t) * (1 - smooth(c.f + c.D - 0.3, c.f + c.D + 1.1, t));
      gz.x = clamp((lf.x - hx) / (S * 0.22), -1, 1); gz.y = clamp((lf.y - hy) / (S * 0.3), -1, 1);
    }
    return gz;
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = growth(t);
    const gt = clamp(g / 0.85);
    const zc = 1 + 0.9 * (1 - smooth(0, 0.7, g));
    const Sz = S * zc;
    const wind = windAt(t);

    // sky
    const top = sample(BG_TOP, t), bot = sample(BG_BOT, t);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, rgbs(top)); sky.addColorStop(1, rgbs(bot));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // stars: the whole sky turns counterclockwise, from the first moment to the last
    drawStars(t, gy, 1);
    for (const ad of advs) { drawShoot(ad, t); drawSparkle(ad, t); }

    // glow
    const gl = sample(GLOW, t);
    const treeH = gt * Sz;
    const gcy = gy - treeH * 0.6, grad = Math.max(S * 0.35, treeH * 0.9);
    const rg = ctx.createRadialGradient(cx, gcy, 0, cx, gcy, grad);
    rg.addColorStop(0, `rgba(${gl[0] | 0},${gl[1] | 0},${gl[2] | 0},${gl[3]})`);
    rg.addColorStop(1, `rgba(${gl[0] | 0},${gl[1] | 0},${gl[2] | 0},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    // motes
    for (const m of motes) {
      const mx = m.x * W + Math.sin(t * 0.3 + m.ph) * 14;
      const my = (((m.y - t * m.s * 0.05) % 1) + 1) % 1 * gy * 0.95;
      const a = 0.12 + 0.22 * (0.5 + 0.5 * Math.sin(t * 0.9 + m.ph));
      ctx.fillStyle = `rgba(${gl[0] | 0},${gl[1] | 0},${gl[2] | 0},${a})`;
      ctx.beginPath(); ctx.arc(mx, my, m.r, 0, TAU); ctx.fill();
    }

    // ground
    const gg = ctx.createLinearGradient(0, gy, 0, H);
    gg.addColorStop(0, 'rgba(8,12,10,0.55)'); gg.addColorStop(1, 'rgba(4,6,6,0.88)');
    ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, gy, W, 1);

    const sway = y => Math.sin(t * 0.8 + y * 2.2) * Sz * 0.0065 * y * y * wind * (0.85 + 0.15 * Math.sin(t * 0.37));
    const X = (x, y) => cx + x * Sz + sway(y);
    const Y = y => gy + 3 - y * Sz;

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // trunk
    if (gt > 0.0005) {
      const woody = smooth(0.05, 0.4, g);
      const trunkCol = rgbs(mixc([140,205,100], [236,232,218], woody));
      const edgeCol = rgbs(mixc([90,160,70], [150,146,130], woody));
      const wBase = 2.4 + Sz * 0.021 * smooth(0, 1, g);
      const tw = un => wBase * (1 - 0.84 * un);
      const n = Math.max(2, Math.ceil(gt * 36));
      for (let pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass ? trunkCol : edgeCol;
        for (let i = 0; i < n; i++) {
          const u0 = gt * i / n, u1 = gt * (i + 1) / n;
          const w = tw((u0 + u1) / 2 / gt);
          ctx.lineWidth = pass ? w * 0.8 : w + 1.4;
          ctx.beginPath();
          ctx.moveTo(X(trunkX(u0), u0), Y(u0));
          ctx.lineTo(X(trunkX(u1), u1), Y(u1));
          ctx.stroke();
        }
      }
      if (g > 0.3) {
        const bgr = ctx.createLinearGradient(0, Y(0), 0, Y(0.11));
        bgr.addColorStop(0, `rgba(40,34,28,${smooth(0.3, 0.6, g) * 0.4})`); bgr.addColorStop(1, 'rgba(40,34,28,0)');
        ctx.strokeStyle = bgr;
        ctx.lineCap = 'butt'; ctx.lineWidth = tw(0.05 / gt) * 0.8;
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) { const u = 0.11 * i / 6; if (i) ctx.lineTo(X(trunkX(u), u), Y(u)); else ctx.moveTo(X(trunkX(u), u), Y(u)); }
        ctx.stroke();
        ctx.lineCap = 'round';
      }
      if (g > 0.22) {
        ctx.fillStyle = `rgba(28,24,20,${smooth(0.22, 0.5, g) * 0.7})`;
        for (const e of eyes) {
          if (e.u > gt * 0.97) continue;
          const w = tw(e.u / gt);
          ctx.beginPath();
          ctx.ellipse(X(trunkX(e.u), e.u) + e.off * w, Y(e.u), Math.max(1, w * 0.32 * e.sz), Math.max(0.8, w * 0.075 * e.sz + 0.4), 0, 0, TAU);
          ctx.fill();
        }
      }
    }

    // branches + twigs
    const thick = 0.5 + 0.5 * smooth(0, 1, g);
    for (const s of segs) {
      const gp = clamp((g - s.t0) / s.span);
      if (gp <= 0) continue;
      const fresh = (1 - clamp((g - s.t0) / 0.4)) * (1 - smooth(11, 17, t));
      ctx.strokeStyle = rgbs(mixc(s.twig ? [150,142,124] : [200,195,178], [130,196,96], fresh * 0.75));
      const steps = Math.max(2, Math.ceil(gp * 10));
      for (let k = 0; k < steps; k++) {
        const a = gp * k / steps, b = gp * (k + 1) / steps;
        const p = bez(s, a), q = bez(s, b);
        ctx.lineWidth = Math.max(0.8, lerp(s.w0, s.w1, (a + b) / 2) * Sz * thick);
        ctx.beginPath();
        ctx.moveTo(X(p[0], p[1]), Y(p[1]));
        ctx.lineTo(X(q[0], q[1]), Y(q[1]));
        ctx.stroke();
      }
    }

    // seed leaves
    const cot = easeOut(clamp((t - 0.9) / 0.9)) * (1 - smooth(0.04, 0.3, g));
    if (cot > 0.01) {
      for (const sg2 of [-1, 1]) leaf(X(trunkX(0.02), 0.02), Y(0.02), sg2 * 2.17, Sz * 0.009 * cot, 0.5, 1, 'rgb(156,216,112)', false);
    }

    // landed leaves
    ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 0.07;
    for (const L of byLy) {
      if (t < L.landT) continue;
      const lx = clamp(cx + (L.ux + L.dx) * S, 14, W - 14), ly = gy + 6 + L.ly * band;
      const r = L.r * S * 0.0125 * (1 + L.ly * 0.4);
      const dark = 1 - 0.2 * clamp((t - L.landT) / 6);
      leaf(lx, ly, L.rest, r, 1, 0.32, rgbs(leafRGB(1, 0, L.v * dark)), false);
    }

    // attached + falling leaves
    const grown = 0.5 + 0.5 * smooth(0, 1, g);
    const fresh = (1 - smooth(0.05, 0.9, g)) * 0.6;
    for (const L of leaves) {
      if (t >= L.landT) continue;
      let ux, uy, ap;
      if (L.seg) {
        const gp = clamp((g - L.seg.t0) / L.seg.span);
        ap = clamp((gp - 0.75 * L.s) / 0.2);
        if (ap <= 0) continue;
        const p = bez(L.seg, Math.min(L.s, gp)); ux = p[0]; uy = p[1];
      } else {
        ap = clamp((t - L.appear) / 1.2);
        if (ap <= 0) continue;
        ux = trunkX(gt); uy = gt;
      }
      const tp = clamp((t - L.turn0) / L.turnD);
      const fp = (t - L.fall0) / L.fallD;
      const shim = 0.5 + 0.5 * Math.sin(t * L.fq * 0.8 + L.ph);
      const sxAtt = 1 - 0.24 * wind * shim;

      if (fp <= 0) {
        const r = L.r * Sz * 0.0125 * grown * easeOut(ap);
        const fl = Math.sin(t * L.fq + L.ph) * 0.24 * wind + Math.sin(t * 1.7 + L.ph * 2) * 0.08 * wind;
        leaf(X(ux, uy), Y(uy), L.ang + fl, r, sxAtt, 1, rgbs(leafRGB(tp, fresh, L.v), (1 - sxAtt) * 0.9), r > 4);
      } else {
        const p = clamp(fp);
        const rx = cx + L.ux * S, ry = gy + 3 - L.uy * S;
        const lx = clamp(cx + (L.ux + L.dx) * S, 14, W - 14), ly = gy + 6 + L.ly * band;
        const ye = p * (0.5 + 0.5 * p);
        const xe = smooth(0, 1, p) * 0.9 + p * 0.1;
        const x = rx + (lx - rx) * xe
                + Math.sin(p * Math.PI * L.sw + L.ph) * S * 0.03 * (1 - p) * Math.min(1, p * 6)
                + sway(L.uy) * (1 - clamp(p * 6));
        const y = ry + (ly - ry) * ye;
        const flat = smooth(0.8, 1, p);
        let rot = L.ang + Math.sin(p * 7 + L.ph) * 1.0 * (1 - p) + p * L.spin * (1 - flat) * 0.6;
        rot = lerp(rot, L.rest, flat);
        const tum = Math.abs(Math.cos(p * 9 + L.ph)) * 0.8 + 0.2;
        const sx = lerp(lerp(sxAtt, tum, smooth(0, 0.15, p)), 1, flat);
        const ky = lerp(1, 0.32, flat);
        const r = L.r * S * 0.0125 * (1 + L.ly * 0.4 * flat);
        leaf(x, y, rot, r, sx, ky, rgbs(leafRGB(tp, 0, L.v)), flat < 0.5);
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // ---- owls ----
    const perchPx = pe => {
      const p = bez(pe.seg, pe.s);
      return { x: X(p[0], p[1]), y: Y(p[1]) - lerp(pe.seg.w0, pe.seg.w1, pe.s) * Sz * thick * 0.5 };
    };
    const lfList = leafCycles.map(c => leafStateFor(c, t));
    let lf = null;
    for (let i = leafCycles.length - 1; i >= 0; i--) if (lfList[i]) { lf = { c: leafCycles[i], s: lfList[i] }; break; }
    const oaB = easeOut(clamp((t - T.owl) / 2.2));
    if (oaB > 0) {                                     // the crutch stays with the wise owl's branch
      const tp = bez(owlSeg, 1.0);
      drawCrutch(oaB, X(tp[0], tp[1]), Y(tp[1]) + lerp(owlSeg.w0, owlSeg.w1, 1) * Sz * thick * 0.5, gy + 14);
    }

    // where the two beaks will meet, once both owls are on the shared branch
    let kg = null;
    if (fin) {
      const Pb = perchPx(fin.meetB), Pw = perchPx(fin.meetW), ob = S * 0.145, ow = S * 0.105;
      const tb = tipLocal(-1), tw2 = tipLocal(1);
      const tipB = { x: Pb.x + tb.x * ob, y: Pb.y + tb.y * ob }, tipW = { x: Pw.x + tw2.x * ow, y: Pw.y + tw2.y * ow };
      const C = { x: (tipB.x + tipW.x) / 2, y: (tipB.y + tipW.y) / 2 };
      kg = { C, b: { x: (C.x - tipB.x) / ob, y: (C.y - tipB.y) / ob }, w: { x: (C.x - tipW.x) / ow, y: (C.y - tipW.y) / ow } };
      if (!fin.C0 && t >= fin.tK - 0.05) fin.C0 = { x: C.x, y: C.y };
    }

    for (const ow of owls) {
      const o = S * ow.k;
      ow.hit = null;
      const a = easeOut(clamp((t - ow.appear) / 2.2));
      if (a <= 0) continue;

      // pose: at home, or somewhere along its climb
      let at = ow.home, nxt = null, flyStep = null, lastLand = -99;
      if (fin) for (const st of fin.routes[ow.id].steps) {
        if (t < st.t0) { nxt = st.to; break; }
        if (t <= st.t1) { flyStep = st; break; }
        at = st.to; lastLand = st.t1;
      }
      let px, py, fly = 0, sy = 1, rot = 0;
      if (flyStep) {
        const A = perchPx(flyStep.from), B = perchPx(flyStep.to);
        const p = (t - flyStep.t0) / (flyStep.t1 - flyStep.t0), e = smooth(0, 1, p);
        const lift = (0.04 * S + 0.1 * Math.hypot(B.x - A.x, B.y - A.y)) * Math.sin(Math.PI * p);
        px = lerp(A.x, B.x, e); py = lerp(A.y, B.y, e) - lift;
        fly = t * 16; sy = 1 + 0.1 * Math.sin(Math.PI * p); rot = (B.x > A.x ? 1 : -1) * 0.12 * Math.sin(Math.PI * p);
      } else {
        const P = perchPx(at); px = P.x; py = P.y;
        const lk = clamp(1 - (t - lastLand) / 0.35);   // a small squat on landing
        if (lk > 0) sy = 1 - 0.08 * Math.sin(lk * Math.PI);
      }
      const headY = py - o * 0.7;

      // the pulse that says "tap me", until the wise owl has been asked something
      if (ow.isBrown && t > T.ready && !advs.length && !fin) {
        const k = smooth(T.ready, T.ready + 2, t) * (0.10 + 0.07 * Math.sin(t * 2));
        const hg = ctx.createRadialGradient(px, py - o * 0.5, o * 0.2, px, py - o * 0.5, o * 1.3);
        hg.addColorStop(0, `rgba(255,214,140,${k})`); hg.addColorStop(1, 'rgba(255,214,140,0)');
        ctx.fillStyle = hg; ctx.fillRect(px - o * 1.4, py - o * 1.9, o * 2.8, o * 2.8);
      }

      // gaze
      const gz = gazeFor(px, headY, t, lf);
      if (fin) {
        gz.w = 1;
        if (nxt) { const N2 = perchPx(nxt); gz.x = clamp((N2.x - px) / (S * 0.2), -1, 1); gz.y = -0.7; }
        else if (!flyStep) { gz.x = ow.ts * -1; gz.y = 0; }   // once settled, each looks at the other
      }

      // kiss: turn to profile, lean in, tilt
      let turn = 0, hdx = 0, hdy = 0, tiltK = 0;
      if (fin && kg && t >= fin.tL0) {
        const kk = clamp((t - fin.tL0) / 1.6), e = kk * kk * (3 - 2 * kk);
        turn = ow.ts * e; tiltK = ow.ts * 0.2 * e;
        const hd = ow.isBrown ? kg.b : kg.w; hdx = hd.x * e; hdy = hd.y * e;
        gz.w = 1 - e;
      }

      const hd0 = sample(HEAD, t - (ow.isBrown ? 0 : 1.4));
      const ac = actionAt(ow.id, t);
      const stretchW = ac && ac.type === 'stretch' ? ac.w : 0, pw = ac && ac.type === 'preen' ? ac.w : 0, pside = ac ? ac.side : 1;
      if (ac && ac.type === 'preen' && t >= ac.a.tf && !ac.a.fx) { ac.a.fx = px + pside * 0.36 * o; ac.a.fy = py - 0.3 * o; ac.a.fo = o; }
      gz.w *= (1 - pw);
      hdx += pside * 0.06 * pw; hdy += 0.13 * pw - 0.02 * stretchW;
      const nod = 0.09 * smooth(T.rest + ow.restDelay + 0.4, T.rest + ow.restDelay + 2.6, t) * (1 - wake(t));
      const pk = clamp(1 - (t - pokes[ow.id]) / 1.2), poke = pk > 0 ? Math.sin((t - pokes[ow.id]) * 10) * 0.14 * pk : 0;
      let bo = 0;                                     // the wise owl's beak opens once per spoken word
      if (ow.isBrown) for (const sp of speeches) for (const w of sp.words) {
        const d = (t - w.start) / 0.45;
        if (d > 0 && d < 1) bo = Math.max(bo, Math.sin(d * Math.PI));
      }
      drawOwlFig(t, px, py, o, {
        pal: ow.pal, a, seed: ow.seed, isBrown: ow.isBrown, drawer: ow.isBrown, bo,
        tilt: hd0[0] + 0.025 * Math.sin(t * 0.7 + ow.seed) * a + gz.w * gz.x * 0.14 + nod + poke + tiltK + pside * 0.55 * pw,
        look: lerp(lerp(hd0[1] * (ow.isBrown ? 1 : 0), gz.x, gz.w), pside * 0.6, pw), lookY: lerp(gz.y * gz.w, 0.9, pw),
        open: eyeOpen(t, ow.blinks, ow.restDelay, Math.max(pw, stretchW)) * (1 - 0.55 * pw), turn, hdx, hdy, fly, sy: sy * (1 + 0.03 * stretchW), rot,
        stretch: stretchW, pw, pside, wph: t * 4 + ow.seed, nib: pw * (0.5 + 0.5 * Math.sin(t * 22)) * 0.9,
        sx: 1 + 0.04 * stretchW + 0.02 * pw * Math.sin(t * 24)
      });
      if (a > 0.4) ow.hit = { x: px, y: py - o * 0.5, rx: o * 0.36 + 12, ry: o * 0.62 + 8 };
    }
    for (const a of actions) {                          // a loose feather from each preen drifts down
      if (a.type !== 'preen' || !a.fx) continue;
      const age = t - a.tf;
      if (age < 0 || age > 3.4) continue;
      drawFeather(a.fx + Math.sin(age * 2.4) * a.fo * 0.16 + age * 3, a.fy + age * a.fo * 0.3, Math.sin(age * 3.1),
                  a.fo * 0.085, 1 - smooth(2.4, 3.4, age), a.id === 'b' ? BROWN.belly : WHITE.belly);
    }
    lfList.forEach((st, i) => { if (st) drawLeaf(st, i === lfList.length - 1); });
    drawVapor(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // ---- finale: everything fades to dark except the spinning stars, then to black ----
    if (fin) {
      const dark = smooth(fin.tK, fin.tK + 5, t), black = smooth(fin.black0, fin.black1, t);
      if (dark > 0.001 && black < 0.999) {
        ctx.fillStyle = `rgba(3,5,12,${dark})`; ctx.fillRect(0, 0, W, H);
        const rush = 1 + 0.5 * smooth(fin.tF0, fin.tF0 + 1.5, t);
        drawStars(t, lerp(gy, H, dark), (1 + 0.2 * dark) * (1 - 0.45 * smooth(fin.tH0 - 0.5, fin.tH0 + 1.5, t)) * rush);
        drawGalaxy(t);
        if (t >= fin.tE0) drawNightEyes(t, perchPx(fin.meetB), perchPx(fin.meetW));
        if (t >= fin.tH0) {
          const Pb = perchPx(fin.meetB), Pw = perchPx(fin.meetW);
          drawStarHeart(t, Math.max(Pb.y - 0.7 * S * 0.145 + 0.1 * S * 0.145, Pw.y - 0.7 * S * 0.105 + 0.1 * S * 0.105));
        }
        drawHearts(t);
      }
      if (black > 0.001) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
      drawTextEyes(t);
    } else if (t < 3.2) {                              // every run (and every loop) opens from black into the glow and the distant stars
      const ia = 1 - smooth(0.2, 3.0, t);
      if (ia > 0.002) { ctx.fillStyle = `rgba(0,0,0,${ia})`; ctx.fillRect(0, 0, W, H); }
    }
  }

  // ---------- Speech: words drift out of the wise owl's beak ----------
  function owlAnchor() {
    const p = bez(owlSeg, OWL_S);
    return { x: cx + p[0] * S, y: gy + 3 - p[1] * S - 2 };
  }
  function makeSpeech(items, kind, t0) {
    const el = document.createElement('div');
    el.className = 'say ' + kind;
    el.setAttribute('role', 'status');
    el.setAttribute('aria-label', items.map(i => i.t).join(' '));
    const ws = [];
    let s = t0;
    items.forEach((it, i) => {
      const w = document.createElement('span');
      w.className = 'wd' + (it.em ? ' em' : '');
      w.setAttribute('aria-hidden', 'true');
      w.textContent = it.t;
      el.appendChild(w);
      let start;
      if (kind === 'open') start = t0 + WSTART[i];
      else { start = s; s += 0.3 + (/[.,;:]$/.test(it.t) ? 0.45 : 0); }
      ws.push({ el: w, start, ph: i * 0.9 + (kind === 'open' ? 0 : 3), c: null });
    });
    document.body.appendChild(el);
    const sp = { el, kind, t0, words: ws, lastArrive: ws[ws.length - 1].start + LDUR, fs: 24 };
    speeches.push(sp);
    measureSpeech(sp);
    return sp;
  }
  function measureSpeech(sp) {
    const cr = cv.getBoundingClientRect();
    const a = owlAnchor(), o = S * 0.145;
    beak.x = beak.x || a.x; beak.y = beak.y || (a.y - o * 0.62);
    sp.el.style.bottom = (H - (a.y - o * 1.5)) + 'px';
    const r = sp.el.getBoundingClientRect();
    for (const w of sp.words) {
      const e = w.el;
      w.c = { x: r.left + e.offsetLeft + e.offsetWidth / 2 - cr.left, y: r.top + e.offsetTop + e.offsetHeight / 2 - cr.top, w: e.offsetWidth };
    }
    sp.fs = parseFloat(getComputedStyle(sp.words[0].el).fontSize) || 24;
    if (sp.kind === 'open') {       // where the last leaf hangs, like a full stop
      fsB = sp.fs;
      const last = sp.words[sp.words.length - 1].c;
      periodPos.r = fsB * 0.11;
      periodPos.x = last.x + last.w / 2 + 0.2 * fsB;
      periodPos.y = last.y + 0.28 * fsB - 2 * periodPos.r;
    }
  }
  function openAlpha(t) {          // the opening line steps aside while the owl gives advice (or the owls leave), then returns
    const a = advs[advs.length - 1];
    let v = a ? 1 - smooth(a.c0, a.c0 + 0.7, t) * (1 - smooth(a.end + 0.5, a.end + 2.5, t)) : 1;
    if (fin) v = Math.min(v, 1 - smooth(fin.f0, fin.f0 + 0.7, t));
    return v;
  }
  function updateSpeeches(t) {
    for (let i = speeches.length - 1; i >= 0; i--) {
      const sp = speeches[i];
      let alpha;
      if (sp.kind === 'open') { if (t < sp.t0 - 0.05) continue; alpha = openAlpha(t); }
      else {
        const ad = sp.adv;
        if (t >= ad.end) { sp.el.remove(); speeches.splice(i, 1); continue; }
        alpha = 1 - smooth(ad.fadeStart, ad.end, t);
        sp.el.style.setProperty('--pa', (smooth(sp.t0 - 0.3, sp.t0 + 0.6, t) * alpha).toFixed(3));
      }
      for (const w of sp.words) {
        const p = clamp((t - w.start) / LDUR), st = w.el.style;
        if (p <= 0) { st.opacity = 0; continue; }
        if (p < 1) {
          const e = easeOut(p), c = w.c;
          st.opacity = clamp(p * 3) * alpha;
          st.filter = 'blur(' + ((1 - e) * 7).toFixed(1) + 'px)';
          st.transform = 'translate(' + ((beak.x - c.x) * (1 - e)) + 'px,' +
            ((beak.y - c.y) * (1 - e) - Math.sin(e * Math.PI) * 14 * (S / 532)) + 'px) scale(' + (0.2 + 0.8 * e) + ')';
        } else {
          const bl = (1 - alpha) * 6;      // once settled, words float a little, as if held in still water
          st.opacity = alpha;
          st.filter = bl > 0.05 ? 'blur(' + bl.toFixed(1) + 'px)' : 'none';
          st.transform = 'translateY(' + (Math.sin(t * 0.8 + w.ph) * sp.fs * 0.03).toFixed(2) + 'px)';
        }
      }
    }
    const ad = advs[advs.length - 1];
    let busy = ad ? smooth(ad.c0 - 0.01, ad.c0 + 0.4, t) * (1 - smooth(ad.end, ad.end + 1.2, t)) : 0;
    if (fin) busy = Math.max(busy, smooth(fin.f0, fin.f0 + 0.5, t));
    hint.style.opacity = (0.78 * smooth(T.ready, T.ready + 2, t) * (1 - busy)).toFixed(3);
    if (fin && t >= fin.tN1 - 0.1) {                   // the last words, on black, in two beats
      const out = 1 - smooth(fin.tNF0, fin.tNF1, t);
      [fin.tN1, fin.tN2].forEach((t0, i) => {
        const o = smooth(t0, t0 + 1.8, t) * out, st = nnLines[i].style;
        st.opacity = o.toFixed(3);
        st.filter = 'blur(' + ((1 - o) * 8).toFixed(1) + 'px)';
      });
    }
  }

  // ---------- Tap an owl ----------
  function startAdvice(t) {
    const prev = advs[advs.length - 1];
    let c0 = t;
    if (prev && t < prev.end) {                   // let the last advice finish arriving, then ease it out
      if (t < prev.sp.lastArrive) { pokes.b = t; return; }
      prev.fadeStart = t; prev.end = t + 0.7; c0 = t + 0.5;
    }
    while (advs.length && advs[0].end < t - 6) advs.shift();
    const g = skyGeom(c0 + 1.5), star = pickStar(c0 + 1.5), tgt = starPos(star, c0 + 1.5, g);
    const side = Math.random() < 0.5 ? -1 : 1;
    const ad = { c0, star, s0: { x: tgt.x + side * W * 0.75, y: Math.min(tgt.y - H * 0.25, tgt.y - 60) }, sp: null, fadeStart: 0, end: 0 };
    const items = nextAdvice().split(' ').map(x => ({ t: x }));
    ad.sp = makeSpeech(items, 'advice', c0 + 1.7);
    ad.sp.adv = ad;
    ad.fadeStart = ad.sp.lastArrive + 2.4 + 0.15 * items.length;
    ad.end = ad.fadeStart + 2.2;
    advs.push(ad);
    cutLeaves(c0);                                     // "It's OK to let go" returns after the advice, and so does the gold leaf
    const la = ad.end + 2.7;
    leafCycles.push({ a: la, f: la + 1.8, D: 5.5, lx: 0.05 + (Math.random() - 0.3) * 0.2, ly: 0.3 + Math.random() * 0.45 });
    ad.rest = la + 1.8 + 5.5 + 0.3;                    // the owl stays awake until the leaf has landed
  }
  function whichOwl(e) {
    const r = cv.getBoundingClientRect();
    for (const ow of [owls[0], owls[1]]) {          // the small white owl first, so it can be tapped even when close
      if (!ow.hit) continue;
      const dx = (e.clientX - r.left - ow.hit.x) / ow.hit.rx, dy = (e.clientY - r.top - ow.hit.y) / ow.hit.ry;
      if (dx * dx + dy * dy <= 1) return ow;
    }
    return null;
  }
  cv.addEventListener('click', e => {
    const ow = whichOwl(e);
    if (!ow || fin) return;
    if (tNow < T.ready) { pokes[ow.id] = tNow; return; }
    lastAct = tNow;
    if (ow.isBrown) startAdvice(tNow); else startFinale(tNow);   // the white owl calls the wise owl to meet her
  });
  cv.addEventListener('pointermove', e => { cv.style.cursor = whichOwl(e) ? 'pointer' : 'default'; });

  // ---------- Playback ----------
  let now0 = null, tNow = 0, ended = false;
  function restart() {
    tNow = 0; ended = false; fin = null; lastAct = 0; pokes.b = pokes.w = -99; advs.length = 0;
    resetLeaves(); actions.forEach(a => { a.fx = null; });
    for (let i = speeches.length - 1; i >= 0; i--) {
      const sp = speeches[i];
      if (sp.kind !== 'open') { sp.el.remove(); speeches.splice(i, 1); }
      else sp.words.forEach(w => { w.el.style.opacity = 0; });
    }
    hint.style.opacity = 0;
    nnLines.forEach(l => { l.style.opacity = 0; l.style.filter = 'none'; });
    btn.classList.remove('on');
  }
  function frame(now) {
    if (now0 === null) now0 = now;
    const dt = Math.min((now - now0) / 1000, 0.05);
    now0 = now;
    tNow += dt * SPEED;
    draw(tNow);
    updateSpeeches(tNow);
    if (!fin && !ended && tNow >= T.end) { btn.classList.add('on'); ended = true; }
    if (!fin && tNow > T.ready) {                    // left alone for a while, the owls go and find each other
      const ad = advs[advs.length - 1];
      const quiet = Math.max(T.ready, lastAct, ad ? ad.end + 2 : 0);
      if (tNow - quiet > IDLE) startFinale(tNow);
    }
    if (fin && tNow >= fin.tLoop) restart();          // after the last words, start over
    requestAnimationFrame(frame);
  }
  btn.addEventListener('click', restart);
  window.addEventListener('resize', layout);
  layout();
  makeSpeech([{ t: 'It’s' }, { t: 'OK' }, { t: 'to' }, { t: 'let', em: 1 }, { t: 'go', em: 1 }], 'open', T.speak);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { speeches.forEach(measureSpeech); measureNight(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
